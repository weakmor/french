<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Французский · Эвелина</title>
<style>
  :root{
    --paper:#faf6ee; --card:#fffdf8; --ink:#232019; --muted:#7b7266;
    --line:#e7dece; --accent:#2b4c7e; --accent-soft:#eaeef6;
    --ok:#2f7a55; --ok-soft:#e8f3ec; --bad:#b3492f; --bad-soft:#fbeae5;
    --near:#a06a12; --near-soft:#fbf1dd;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font:15px/1.6 "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  .wrap{max-width:880px; margin:0 auto; padding:0 20px}
  .fr{font-family:Georgia,"Times New Roman",serif}

  /* ---------- header ---------- */
  header{
    position:sticky; top:0; z-index:20;
    background:rgba(250,246,238,.93);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .topbar{display:flex; align-items:center; gap:16px; padding:14px 0 10px}
  .logo{
    width:44px; height:44px; flex:0 0 44px; border-radius:13px;
    background:var(--accent); color:#fff; display:grid; place-items:center;
    font-family:Georgia,serif; font-size:19px; letter-spacing:.5px;
  }
  .who{flex:1; min-width:0}
  h1{margin:0; font:600 19px/1.2 Georgia,serif}
  .sub{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
  .prog{width:168px; flex:0 0 auto}
  .pbar{height:7px; background:#e9e0cf; border-radius:99px; overflow:hidden}
  .pfill{height:100%; width:0; background:var(--accent); transition:width .35s ease}
  .ptext{font-size:11.5px; color:var(--muted); margin-top:6px; text-align:right; white-space:nowrap}

  nav{display:flex; gap:6px; overflow-x:auto; padding:0 0 10px; scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  .tab{
    border:1px solid transparent; background:transparent; color:var(--muted);
    padding:7px 14px; border-radius:99px; font:inherit; font-size:14px;
    cursor:pointer; white-space:nowrap; transition:background .15s,color .15s;
  }
  .tab:hover{color:var(--ink)}
  .tab.on{
    background:var(--card); border-color:var(--line); color:var(--ink);
    font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.04);
  }

  /* ---------- sections ---------- */
  main{padding-bottom:70px}
  section{display:none}
  section.on{display:block; animation:fade .22s ease}
  @keyframes fade{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none}}
  .lead{color:var(--muted); font-size:13.5px; margin:22px 0 4px}
  h2{font:600 17px/1.3 Georgia,serif; margin:26px 0 10px}

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:16px 18px; margin:11px 0;
  }
  .card.soft{background:#fdfaf3}
  .note{font-size:13px; color:var(--muted); margin:0}
  .note b{color:var(--ink); font-weight:600}

  /* ---------- plan ---------- */
  .day{display:grid; grid-template-columns:36px 1fr 34px; gap:14px; align-items:start}
  .num{
    width:34px; height:34px; border-radius:11px; background:#f2e9d7; color:#6a5d49;
    display:grid; place-items:center; font-weight:600; font-size:13.5px;
  }
  .day.done .num{background:var(--ok); color:#fff}
  .day.done .dtext{opacity:.55}
  .dtext h3{margin:0 0 3px; font:600 15px/1.35 Georgia,serif}
  .goal{margin:0 0 6px; font-size:12.5px; color:var(--muted)}
  .task{margin:0; font-size:14px}
  .extra{margin:6px 0 0; font-size:12.5px; color:var(--muted); font-style:italic}
  .chk{
    width:32px; height:32px; border-radius:10px; border:1.5px solid var(--line);
    background:#fff; cursor:pointer; color:transparent; font-size:15px; line-height:1;
    transition:all .15s;
  }
  .chk:hover{border-color:#c9bca6}
  .chk.on{background:var(--ok); border-color:var(--ok); color:#fff}
  .week{margin:26px 0 6px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}

  /* ---------- phrases / vocab ---------- */
  .toolbar{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 6px}
  .btn{
    border:1px solid var(--line); background:var(--card); color:var(--ink);
    padding:7px 13px; border-radius:99px; font:inherit; font-size:13px; cursor:pointer;
    transition:background .15s,border-color .15s;
  }
  .btn:hover{background:#f6efe1; border-color:#d8c9ae}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  .btn.primary:hover{background:#234069}
  .btn.playing{background:var(--accent); border-color:var(--accent); color:#fff}
  .btn.small{padding:4px 10px; font-size:12px}

  .row{display:flex; gap:12px; align-items:baseline; padding:11px 0; border-bottom:1px dashed var(--line)}
  .row:last-child{border-bottom:0}
  .row .txt{flex:1; min-width:0}
  .row .fr{font-size:16.5px; line-height:1.4}
  .row .ru{font-size:13px; color:var(--muted)}
  .hide-tr .ru{filter:blur(5px); transition:filter .2s; cursor:pointer}
  .hide-tr .ru:hover{filter:none}
  .spk{
    flex:0 0 auto; width:30px; height:30px; border-radius:50%; border:1px solid var(--line);
    background:#fff; cursor:pointer; font-size:13px; color:var(--accent); line-height:1;
  }
  .spk:hover{background:var(--accent-soft)}
  .spk.playing{background:var(--accent); border-color:var(--accent); color:#fff}
  .chip{
    font-size:11px; padding:2px 7px; border-radius:6px; background:#f0e8d8; color:#7a6b53;
    font-weight:600;
  }
  .chip.f{background:#f7e6e1; color:#9c5443}
  .chip.m{background:#e4ecf7; color:#3f5f8d}
  .ex{font-size:12.5px; color:var(--muted); margin-top:2px}

  /* ---------- drills ---------- */
  .drill{position:relative}
  .drill .qn{font-size:11.5px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase}
  .q{margin:6px 0 12px; font-size:15px}
  input[type=text], textarea{
    width:100%; font:inherit; font-size:15px; padding:10px 12px; border-radius:11px;
    border:1px solid var(--line); background:#fff; color:var(--ink);
  }
  input[type=text]{font-family:Georgia,serif}
  input[type=text]:focus, textarea:focus{outline:2px solid var(--accent-soft); border-color:#b9c6dc}
  textarea{min-height:86px; resize:vertical; font-family:Georgia,serif}
  .drow{display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap}
  .fb{font-size:13.5px; margin-top:10px; padding:9px 12px; border-radius:10px; display:none}
  .fb.show{display:block}
  .fb.ok{background:var(--ok-soft); color:#1f5a3d}
  .fb.near{background:var(--near-soft); color:#7d5311}
  .fb.bad{background:var(--bad-soft); color:#8d3924}
  .fb .ans{font-family:Georgia,serif; font-size:14.5px}
  .opts{display:flex; gap:8px; flex-wrap:wrap}
  .opt{
    border:1px solid var(--line); background:#fff; border-radius:11px; padding:8px 16px;
    font:inherit; font-size:14.5px; font-family:Georgia,serif; cursor:pointer;
  }
  .opt:hover{background:#f7f1e3}
  .opt.ok{background:var(--ok-soft); border-color:#a8cdb7; color:#1f5a3d}
  .opt.bad{background:var(--bad-soft); border-color:#e0b4a6; color:#8d3924}
  .drill.solved{border-color:#cfe4d8}
  .drill.solved::after{
    content:"решено"; position:absolute; top:14px; right:16px; font-size:11px;
    color:var(--ok); text-transform:uppercase; letter-spacing:.07em;
  }
  .hint{font-size:12.5px; color:var(--muted); margin-top:8px; display:none}
  .hint.show{display:block}
  .link{
    background:none; border:0; padding:0; font:inherit; font-size:12.5px;
    color:var(--accent); cursor:pointer; text-decoration:underline; text-underline-offset:3px;
  }

  /* ---------- errors ---------- */
  .err{border-left:3px solid #e3cdc4; padding:2px 0 2px 14px; margin:14px 0}
  .err .wrong{color:var(--bad); text-decoration:line-through; text-decoration-color:rgba(179,73,47,.45)}
  .err .right{color:var(--ok); font-weight:600}
  .err .rule{font-size:12.5px; color:var(--muted); margin-top:3px}

  /* ---------- lessons ---------- */
  .lesson{background:var(--card); border:1px solid var(--line); border-radius:16px; margin:10px 0; overflow:hidden}
  .lhead{
    display:flex; gap:12px; align-items:center; width:100%; text-align:left;
    background:none; border:0; padding:14px 16px; cursor:pointer; font:inherit; color:var(--ink);
  }
  .lhead:hover{background:#fbf6ea}
  .lnum{
    width:30px; height:30px; flex:0 0 30px; border-radius:9px; background:#f2e9d7; color:#6a5d49;
    display:grid; place-items:center; font-weight:600; font-size:13px;
  }
  .lmeta{flex:1; min-width:0; display:flex; flex-direction:column; gap:1px}
  .lt{font:600 15px/1.3 Georgia,serif}
  .lg{font-size:12px; color:var(--muted)}
  .chev{color:var(--muted); font-size:11px; transition:transform .2s}
  .lesson.open .chev{transform:rotate(180deg)}
  .lbody{display:none; padding:2px 18px 18px}
  .lesson.open .lbody{display:block; animation:fade .2s ease}
  .lbody h4{
    font:600 11.5px/1.4 "Segoe UI", system-ui, sans-serif; letter-spacing:.07em; text-transform:uppercase;
    color:var(--muted); margin:18px 0 6px;
  }
  .lbody p{margin:0 0 8px; font-size:14px}
  .lbody ul, .lbody ol{margin:0 0 10px; padding-left:20px; font-size:14px}
  .lbody li{margin:3px 0}
  .examples{background:#fbf7ee; border:1px solid var(--line); border-radius:12px; padding:6px 12px; margin:6px 0 10px}
  .exrow{display:flex; gap:14px; padding:5px 0; border-bottom:1px dashed #eee4d2; font-size:14px}
  .exrow:last-child{border-bottom:0}
  .exrow .fr{flex:1.15; font-family:Georgia,serif; line-height:1.4}
  .exrow .ru{flex:1; color:var(--muted); font-size:13px; line-height:1.45}

  /* ---------- список уроков ---------- */
  .lcard{
    display:grid; grid-template-columns:44px 1fr auto; gap:14px; align-items:center;
    width:100%; text-align:left; font:inherit; color:var(--ink); cursor:pointer;
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:13px 16px; margin:10px 0;
  }
  .lcard:hover{border-color:#d9c9ab; background:#fdfaf3}
  .ldot{
    width:42px; height:42px; border-radius:12px; background:#f2e9d7; color:#6a5d49;
    display:grid; place-items:center; font:600 15px Georgia,serif;
  }
  .lcard.done .ldot{background:var(--ok); color:#fff}
  .lcenter{display:flex; flex-direction:column; gap:2px; min-width:0}
  .lct{font:600 15px/1.3 Georgia,serif}
  .lcg{font-size:12.5px; color:var(--muted)}
  .mini{font-size:11.5px; color:var(--muted)}
  .mini b{color:var(--ink); font-weight:600}
  .larrow{color:#bdb2a0; font-size:18px}

  /* ---------- экран урока ---------- */
  .lvtop{margin:18px 0 8px}
  .back{border:0; background:none; padding:0; font:inherit; font-size:13px; color:var(--accent); cursor:pointer}
  .back:hover{text-decoration:underline}
  .lvhead{display:flex; align-items:center; gap:12px; margin:0 0 4px}
  .lvnum{
    width:36px; height:36px; flex:0 0 36px; border-radius:11px; background:var(--accent); color:#fff;
    display:grid; place-items:center; font:600 15px Georgia,serif;
  }
  .lvtitle{margin:0; font:600 19px/1.25 Georgia,serif}
  .lvgoal{margin:2px 0 0; font-size:13px; color:var(--muted)}
  .lvprog{display:flex; gap:5px; margin:16px 0 8px}
  .pdot{height:6px; flex:1; border-radius:99px; background:#e8dfcd; transition:background .2s}
  .pdot.on{background:var(--ok)}
  .lsection{margin:26px 0 0}
  .lsection > h2{
    font:600 11.5px/1.4 "Segoe UI", system-ui, sans-serif; letter-spacing:.08em; text-transform:uppercase;
    color:var(--muted); margin:0 0 10px;
  }
  .leadhint{font-size:13px; color:var(--muted); margin:0 0 10px}

  .todolist{display:flex; flex-direction:column; gap:8px}
  .todoitem{
    display:flex; gap:11px; align-items:flex-start; text-align:left;
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:11px 14px; font:inherit; font-size:14px; color:var(--ink); cursor:pointer;
  }
  .todoitem:hover{background:#fdfaf3; border-color:#ddcdb0}
  .tcheck{
    width:20px; height:20px; flex:0 0 20px; border-radius:6px; border:1.5px solid var(--line);
    background:#fff; display:grid; place-items:center; font-size:11px; color:transparent; margin-top:1px;
  }
  .todoitem.done .tcheck{background:var(--ok); border-color:var(--ok); color:#fff}
  .todoitem.done .ttext{color:var(--muted); text-decoration:line-through; text-decoration-color:rgba(0,0,0,.25)}

  /* ---------- тренировка ---------- */
  .prac-size{display:flex; gap:6px}
  .prac-size .btn.on{background:var(--accent); border-color:var(--accent); color:#fff}
  .prac-mode{display:grid; gap:10px; margin:16px 0}
  .prac-btn{
    display:block; width:100%; text-align:left; cursor:pointer;
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:15px 18px; font:inherit; color:var(--ink);
  }
  .prac-btn:hover{border-color:#d9c9ab; background:#fdfaf3}
  .prac-btn b{display:block; font:600 15px Georgia,serif; margin-bottom:3px}
  .prac-btn span{font-size:13px; color:var(--muted)}
  .opts.col{flex-direction:column; align-items:stretch; gap:8px}
  .opt.wide{width:100%; text-align:left; padding:12px 16px}
  .pdot.bad{background:var(--bad)}
  .built{
    min-height:54px; display:flex; flex-wrap:wrap; gap:8px; align-items:flex-start;
    border:1px dashed #d9c9ab; border-radius:12px; padding:10px; background:#fff; margin:8px 0;
  }
  .built.empty::after{content:"нажимай слова ниже"; color:#bdb2a0; font-size:13px}
  .word{
    border:1px solid var(--line); background:#fff; border-radius:10px; padding:7px 12px;
    font:inherit; font-size:15px; font-family:Georgia,serif; cursor:pointer; color:var(--ink);
    display:inline-block; line-height:1.3;
  }
  .word:hover{background:#f7f1e3}
  .word.used{opacity:.25; pointer-events:none}
  .qphrase{font-family:Georgia,serif; font-size:17px; line-height:1.5; margin:0 0 10px}
  .qphrase .gap{color:var(--accent); font-weight:600; letter-spacing:1px}
  .result-score{font:600 40px/1 Georgia,serif; color:var(--accent); margin:6px 0}
  .mistake{border-left:3px solid var(--bad); padding:2px 0 2px 12px; margin:12px 0}
  .mistake .fr{font-family:Georgia,serif}
  .mistake .ru{font-size:13px; color:var(--muted)}

  footer{border-top:1px solid var(--line); padding:22px 0 40px; margin-top:10px}
  footer p{font-size:12px; color:var(--muted); margin:0 0 10px}

  .toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
    background:#232019; color:#fff8ea; padding:12px 17px; border-radius:13px;
    font-size:13px; line-height:1.45; max-width:min(92vw,540px); z-index:80;
    box-shadow:0 10px 30px rgba(0,0,0,.22); transition:opacity .35s;
  }

  @media (max-width:560px){
    .wrap{padding:0 15px}
    .prog{width:96px}
    .ptext{font-size:10.5px}
    .day{grid-template-columns:32px 1fr 32px; gap:10px}
    .row .fr{font-size:15.5px}
  }
  @media print{
    header,nav,.toolbar,.spk,.chk{display:none!important}
    section{display:block!important}
    body{background:#fff}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="topbar">
      <div class="logo">fr</div>
      <div class="who">
        <h1>Французский</h1>
        <p class="sub">Эвелина · A1 · 15 минут в день</p>
      </div>
      <div class="prog">
        <div class="pbar"><div class="pfill" id="pfill"></div></div>
        <div class="ptext" id="ptext">0 из 24</div>
      </div>
    </div>
    <nav id="nav">
      <button class="tab on" data-act="tab" data-tab="plan">План</button>
      <button class="tab" data-act="tab" data-tab="lessons">Уроки</button>
      <button class="tab" data-act="tab" data-tab="practice">Тренировка</button>
      <button class="tab" data-act="tab" data-tab="ref">Справочник</button>
      <button class="tab" data-act="tab" data-tab="errors">Ошибки</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section id="plan" class="on"></section>
  <section id="lessons"></section>
  <section id="practice"></section>
  <section id="lessonview"></section>
  <section id="ref"></section>
  <section id="errors"></section>
</main>

<footer class="wrap">
  <p id="progtext">Прогресс хранится в этом браузере. Если откроешь файл в другом браузере — галочки не перенесутся. Звук — в папке <b>audio</b>, рядом с index.html.</p>
  <button class="btn small" data-act="reset">Сбросить прогресс</button>
</footer>

<noscript>
  <p style="padding:20px">Для этого файла нужен JavaScript — включи его в браузере.</p>
</noscript>

<script src="config.js"></script>
<script>
"use strict";

/* ============================ данные ============================ */

const DAYS = [
  {n:1, t:"Элизия", g:"перестать писать «je apprend» и «le universite»",
   task:"Правило (блок A в уроке 1) + напиши 10 предложений с j', l', qu'.",
   extra:"Перепиши свой текст №5 из диагностики с исправлениями."},
  {n:2, t:"Акценты и раскладка", g:"перестать бояться é, è, ç",
   task:"Переключись на французскую раскладку (Win+Space) и перепиши 5 фраз с акцентами, читая вслух.",
   extra:"Продиктуй себе 5 слов и проверь написание."},
  {n:3, t:"être / avoir + род", g:"je suis étudiante, une leçon, l'université",
   task:"Выучи être и avoir, плюс 10 слов вместе с артиклем (вкладка «Слова»).",
   extra:"5 фраз о себе только через être и avoir."},
  {n:4, t:"Презенс на -er", g:"parler, étudier, jouer, marcher, aimer, habiter",
   task:"Все 6 форм пяти глаголов, потом 5 фраз о своём дне.",
   extra:"То же самое, но в отрицании: je ne parle pas…"},
  {n:5, t:"depuis", g:"«J'apprends le français depuis deux mois» — навсегда",
   task:"5 предложений «я … уже N времени»: учу, живу, работаю, знаю, жду.",
   extra:"Вопрос Depuis combien de temps…? и ответы на него."},
  {n:6, t:"Кафе и «повторите»", g:"15 фраз выживания",
   task:"Выучи 15 фраз с вкладки «Фразы», потом диалог: я официант, ты заказываешь.",
   extra:"Второй диалог: я прохожий, ты спрашиваешь дорогу."},
  {n:7, t:"Слушание + итог недели", g:"услышать то, что уже знаешь",
   task:"Coffee Break French, сезон 1, эпизод 1 (или Alice Ayel). 5 минут, потом 3 фразы вслух за диктором.",
   extra:"Повтори все ошибки из журнала за неделю."},
  {n:8, t:"Вопросы", g:"три способа спросить одно и то же",
   task:"Tu as quel âge ? / Est-ce que tu as quel âge ? / Quel âge as-tu ? — придумай 8 вопросов, которые тебе реально нужны.",
   extra:"Расспроси меня (я «француз») и запиши мои ответы."},
  {n:9, t:"Отрицание", g:"ne … pas, ne … jamais, ne … rien",
   task:"8 фраз «я не …» о себе.",
   extra:"Переделай 8 своих старых фраз в отрицание."},
  {n:10, t:"Глаголы на -re и -ir", g:"apprendre, comprendre, prendre, finir, choisir",
   task:"По 4 формы каждому, потом 10 предложений с ними.",
   extra:"Мини-диктант: я даю русскую фразу — ты пишешь французскую."},
  {n:11, t:"Passé composé", g:"рассказать, что было вчера",
   task:"10 глаголов с avoir, потом 5 фраз о вчерашнем дне.",
   extra:"Ещё 5 фраз о выходных и разбор."},
  {n:12, t:"Города и страны", g:"à Moscou, en France, au Canada, aux États-Unis",
   task:"10 фраз: я был(а), поеду, живу.",

/* ============================ состояние ============================ */

const KEY = "fr-progress-v1";

// Облако (Supabase) — если заполнен config.js; иначе локальный сервер; иначе только браузер.
const CFG = window.FR_CONFIG || {};
const SB = (CFG.supabaseUrl && CFG.supabaseKey) ? {
  rest: String(CFG.supabaseUrl).replace(/\/+$/, "") + "/rest/v1/progress",
  key: CFG.supabaseKey,
  id: CFG.rowId || "evelina-fr"
} : null;
const LOCAL_API = (!SB && (location.protocol === "http:" || location.protocol === "https:")) ? "/api/state" : null;
const SYNC = !!(SB || LOCAL_API);

function sbHeaders(extra){
  return Object.assign({
    "apikey": SB.key,
    "Authorization": "Bearer " + SB.key,
    "Content-Type": "application/json"
  }, extra || {});
}

async function jfetch(url, opts){
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 8000);
  try{
    return await fetch(url, Object.assign({ signal: ctl.signal }, opts || {}));
  } finally {
    clearTimeout(t);
  }
}

async function remoteGet(){
  if(SB){
    const r = await jfetch(SB.rest + "?select=data&id=eq." + encodeURIComponent(SB.id), { headers: sbHeaders(), cache: "no-store" });
    if(!r.ok) return null;
    const rows = await r.json();
    return (rows && rows.length) ? rows[0].data : null;
  }
  if(LOCAL_API){
    const r = await jfetch(LOCAL_API, { cache: "no-store" });
    if(!r.ok) return null;
    const d = await r.json();
    return (d && Object.keys(d).length) ? d : null;
  }
  return null;
}

async function remotePut(data){
  if(SB){
    await jfetch(SB.rest, {
      method: "POST",
      headers: sbHeaders({ "Prefer": "resolution=merge-duplicates,return=minimal" }),
      body: JSON.stringify([{ id: SB.id, data: data, updated_at: new Date().toISOString() }])
    });
    return;
  }
  if(LOCAL_API){
    await jfetch(LOCAL_API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });
  }
}

function defaultState(){
  return {days:{}, drills:{}, answers:{}, todo:{}, tab:"plan", hideTr:false, rate:1, lesson:1, pracSize:10, practice:{done:0, correct:0}};
}

// «Пустой» прогресс — чтобы первое открытие с любого устройства не затёрло уже сделанное.
function isBlank(s){
  if(!s) return true;
  return !Object.keys(s.days || {}).length
      && !Object.keys(s.drills || {}).length
      && !Object.keys(s.answers || {}).length
      && !Object.keys(s.todo || {}).length;
}

let state = defaultState();
let saveTimer = null;

function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  if(!SYNC) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { remotePut(state).catch(() => {}); }, 400);
}

function loadLocal(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) state = Object.assign(defaultState(), JSON.parse(raw));
  }catch(e){ /* приватный режим или file:// без хранилища */ }
}

async function syncCloud(){
  if(!SYNC) return;
  try{
    const remote = await remoteGet();
    if(remote && !isBlank(remote)){
      state = Object.assign(defaultState(), remote);
      try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
      renderAll();
    } else if(!isBlank(state)){
      await remotePut(state);
    }
  }catch(e){}
}

/* ============================ прогресс ============================ */

function updateProgress(){
  const d = Object.keys(state.days).filter(k => state.days[k]).length;
  const x = Object.keys(state.drills).filter(k => state.drills[k]).length;
  const total = DAYS.length + DRILLS.length;
  const done = d + x;
  const pct = Math.round(done / total * 100);
  const fill = document.getElementById("pfill");
  const text = document.getElementById("ptext");
  if(fill) fill.style.width = pct + "%";
  if(text) text.textContent = d + " дн · " + x + " упр · " + pct + "%";
}

/* ============================ озвучка ============================ */

let voices = [];
function refreshVoices(){
  try{ voices = window.speechSynthesis.getVoices() || []; }catch(e){ voices = []; }
}
function frenchVoice(){
  const fr = voices.filter(v => /^fr/i.test(v.lang));
  if(!fr.length) return null;
  const nice = /Eloise|Denise|Vivienne|Amélie|Amelie/i;
  const frFr = fr.filter(v => /^fr-FR/i.test(v.lang));
  return frFr.find(v => nice.test(v.name)) || frFr[0] || fr.find(v => nice.test(v.name)) || fr[0];
}
function withVoices(cb){
  if(!("speechSynthesis" in window)) return;
  if(voices.length) return cb();
  let done = false;
  const go = () => { if(done) return; done = true; refreshVoices(); cb(); };
  try{ window.speechSynthesis.addEventListener("voiceschanged", go, {once:true}); }catch(e){}
  setTimeout(go, 1200);
}
function utter(text){
  const v = frenchVoice();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = v ? v.lang : "fr-FR";
  if(v) u.voice = v;
  u.rate = 0.92 * (state.rate || 1);
  return u;
}

// Звук: сначала mp3 из папки audio, speechSynthesis — только запасной вариант.
let live = [];
let seqToken = 0;
let currentAudio = null;

function stopAll(){
  seqToken++;
  live = [];
  if(currentAudio){
    try{ currentAudio.pause(); }catch(e){}
    currentAudio = null;
  }
  document.querySelectorAll(".spk.playing").forEach(b => b.classList.remove("playing"));
  try{ window.speechSynthesis.cancel(); }catch(e){}
  try{ window.speechSynthesis.resume(); }catch(e){}
}

function enqueue(text, onFinish){
  const u = utter(text);
  const drop = () => { live = live.filter(x => x !== u); };
  u.onend = () => { drop(); if(onFinish) onFinish(true); };
  u.onerror = () => { drop(); if(onFinish) onFinish(false); };
  live.push(u);
  window.speechSynthesis.speak(u);
  return u;
}

function speakTTS(text, btn, onDone){
  withVoices(() => {
    if(!frenchVoice()){
      showVoiceHint();
      if(btn) btn.classList.remove("playing");
      if(onDone) onDone();
      return;
    }
    if(btn) btn.classList.add("playing");
    enqueue(text, () => {
      if(btn) btn.classList.remove("playing");
      if(onDone) onDone();
    });
    try{ window.speechSynthesis.resume(); }catch(e){}
  });
}

function playFile(src, text, btn, onDone, rateOverride){
  let finished = false;
  let a = null;

  const finish = fallback => {
    if(finished) return;
    finished = true;
    if(a){ try{ a.pause(); }catch(e){} }
    if(currentAudio === a) currentAudio = null;
    if(btn) btn.classList.remove("playing");
    if(fallback) speakTTS(text, btn, onDone);
    else if(onDone) onDone();
  };

  try{ a = new Audio(src); }catch(e){ finish(true); return; }

  currentAudio = a;
  try{ a.playbackRate = rateOverride || state.rate || 1; }catch(e){}
  if(btn) btn.classList.add("playing");
  a.onended = () => finish(false);
  a.onerror = () => finish(true);
  const pr = a.play();
  if(pr && typeof pr.catch === "function") pr.catch(() => finish(true));
}

// Пауза после cancel() обязательна: иначе Edge гасит новую реплику вместе со старой.
function speak(text, btn, src){
  stopAll();
  if(src) playFile(src, text, btn);
  else speakTTS(text, btn);
}

function speakAll(){
  stopAll();
  const tok = seqToken;
  const btns = Array.from(document.querySelectorAll('section.on .spk[data-i]'));
  if(!btns.length) return;
  let i = 0;
  const step = () => {
    if(tok !== seqToken || i >= btns.length) return;
    const btn = btns[i++];
    const p = PHRASES[Number(btn.dataset.i)];
    if(!p) return;
    playFile(p.a, p.fr, btn, () => {
      if(tok !== seqToken) return;
      setTimeout(step, 280);
    });
  };
  step();
}
function toast(msg){
  const d = document.createElement("div");
  d.className = "toast";
  d.textContent = msg;
  document.body.appendChild(d);
  setTimeout(() => { d.style.opacity = "0"; setTimeout(() => d.remove(), 400); }, 5600);
}
let hintShown = false;
function showVoiceHint(){
  if(hintShown){ return; }
  hintShown = true;
  toast("Не проигрался звук. Проверь, что папка audio лежит рядом с index.html — и что файл не открыт из архива.");
  const box = document.getElementById("voicehint");
  if(box){ box.style.display = "block"; }
}

/* ============================ проверка ответов ============================ */

function base(s){
  return String(s).toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[’']/g, "")
    .replace(/[^a-z]/g, "");
}
function accKey(s){
  return String(s).toLowerCase()
    .replace(/[’']/g, "'")
    .replace(/[^a-zà-öø-ÿ'’]/g, "");
}

function drillByN(n){ return DRILLS.find(d => d.n === Number(n)); }

function rateText(){
  return state.rate === 1 ? "1×" : String(state.rate).replace(".", ",") + "×";
}

function cap(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

function markSolved(n){
  state.drills[n] = true;
  save();
  const card = document.getElementById("drill-" + n);
  if(card) card.classList.add("solved");
  updateProgress();
  syncLessonProgress();
}

/* обновляет полоску и счётчик прямо на экране урока, не перерисовывая задания */
function syncLessonProgress(){
  const L = LESSONS.find(x => x.n === Number(state.lesson));
  if(!L || state.tab !== "lesson") return;
  const st = lessonStats(L.n);
  document.querySelectorAll("#lessonview .pdot").forEach((d, i) => d.classList.toggle("on", i < st.done));
  const mini = document.querySelector("#lessonview .lvprog + .mini");
  if(mini) mini.textContent = "задания: " + st.done + " из " + st.total;
}

/* Ответы хранятся только у тебя в браузере. Кнопка «Скачать» кладёт их в файл,
   чтобы Эвелина могла показать их в чате. Никуда в сеть ничего не уходит. */
function rememberAnswer(n, text, verdict){
  if(!state.answers) state.answers = {};
  state.answers[n] = { text: text, verdict: verdict, at: Date.now() };
  save();
}

function buildReport(){
  const now = new Date();
  const pad = x => String(x).padStart(2, "0");
  const days = DAYS.filter(d => state.days[d.n]).map(d => d.n);
  const solved = DRILLS.filter(d => state.drills[d.n]).length;
  const verdictText = v => v === "ok" ? "верно" : v === "near" ? "почти (акценты)" : v === "open" ? "свободное" : "неверно";
  const out = [];
  out.push("Французский · результаты");
  out.push("Дата выгрузки: " + pad(now.getDate()) + "." + pad(now.getMonth() + 1) + "." + now.getFullYear() + " " + pad(now.getHours()) + ":" + pad(now.getMinutes()));
  out.push("Дней отмечено: " + days.length + " из " + DAYS.length + (days.length ? " (" + days.join(", ") + ")" : ""));
  out.push("Упражнений решено: " + solved + " из " + DRILLS.length);
  out.push("");
  DRILLS.forEach(d => {
    const a = (state.answers || {})[d.n];
    out.push("Задание " + d.n + ": " + d.q);
    if(a && a.text) out.push("  мой ответ: " + a.text + "   [" + verdictText(a.verdict) + "]");
    else if(state.drills[d.n]) out.push("  мой ответ: (отмечено как сделанное)");
    else out.push("  мой ответ: —");
    if(d.answers) out.push("  правильно: " + d.answers[0]);
    else if(d.answer) out.push("  правильно: " + d.answer);
    if(d.example) out.push("  пример: " + d.example);
    out.push("");
  });
  return out.join("\n");
}

function checkFill(n){
  const d = drillByN(n);
  const input = document.getElementById("in-" + n);
  const fb = document.getElementById("fb-" + n);
  const hint = document.getElementById("hint-" + n);
  const val = input.value.trim();
  if(!val){ feedback(fb, "bad", "Пусто. Хотя бы попробуй — ошибка тоже результат."); return; }

  const exact = d.answers.some(a => base(a) === base(val));
  const accentsMatch = d.answers.some(a => accKey(a) === accKey(val));

  let verdict = "bad";
  if(exact && accentsMatch) verdict = "ok";
  else if(exact) verdict = "near";
  rememberAnswer(n, val, verdict);

  if(exact && accentsMatch){
    feedback(fb, "ok", "Верно. <span class='ans fr'>" + cap(d.answers[0]) + "</span>");
    markSolved(n);
    if(hint) hint.classList.remove("show");
  } else if(exact){
    feedback(fb, "near", "Почти — не хватает акцентов: <span class='ans fr'>" + cap(d.answers[0]) + "</span>");
    markSolved(n);
  } else {
    const msg = d.type === "dictation"
      ? "Пока нет. Послушай ещё раз — лучше «медленно», и проверь, все ли слова на месте."
      : "Пока нет.";
    feedback(fb, "bad", msg);
    if(hint) hint.classList.add("show");
  }
}

function checkFind3(n){
  const d = drillByN(n);
  const input = document.getElementById("in-" + n);
  const fb = document.getElementById("fb-" + n);
  const hint = document.getElementById("hint-" + n);
  const val = base(input.value);
  const missing = d.keywords.filter(k => !val.includes(base(k)));
  if(!val){ feedback(fb, "bad", "Напиши, что не так, хотя бы одним словом."); return; }
  rememberAnswer(n, input.value.trim(), missing.length === 0 ? "ok" : "bad");
  if(missing.length === 0){
    feedback(fb, "ok", "Все три найдены: <span class='ans fr'>" + d.answer + "</span>");
    markSolved(n);
  } else {
    feedback(fb, "bad", "Нашла " + (d.keywords.length - missing.length) + " из 3. Смотри на город, на «je» перед гласной и на «c» с хвостиком.");
    if(hint) hint.classList.add("show");
  }
}

function feedback(el, kind, html){
  if(!el) return;
  el.className = "fb show " + kind;
  el.innerHTML = html;
}

/* ============================ тренировка ============================ */

function rnd(n){ return Math.floor(Math.random() * n); }
function shuffle(a){
  const x = a.slice();
  for(let i = x.length - 1; i > 0; i--){
    const j = rnd(i + 1);
    const t = x[i]; x[i] = x[j]; x[j] = t;
  }
  return x;
}
function sample(arr, n){ return shuffle(arr).slice(0, n); }

let session = null;

function allWords(){
  const set = new Set();
  PHRASES.forEach(p => p.fr.split(/\s+/).forEach(w => {
    const c = w.replace(/[.,!?;:«»"]/g, "");
    if(c.length >= 3) set.add(c);
  }));
  return Array.from(set);
}

function audioItem(p){
  const others = PHRASES.filter(x => x !== p).map(x => x.ru);
  return { kind: "audio", phrase: p, options: shuffle([p.ru].concat(sample(others, 2))), answer: p.ru };
}

function clozeItem(p){
  const raw = p.fr.split(/\s+/);
  const cands = raw
    .map((w, i) => ({ i: i, clean: w.replace(/[.,!?;:«»"]/g, "") }))
    .filter(x => x.i > 0 && x.clean.length >= 4);
  if(!cands.length) return null;
  const pick = cands[rnd(cands.length)];
  const sentence = raw.map((w, i) => i === pick.i ? "___" : w).join(" ");
  const pool = allWords().filter(w => w.toLowerCase() !== pick.clean.toLowerCase());
  return {
    kind: "cloze", phrase: p, sentence: sentence, answer: pick.clean,
    options: shuffle([pick.clean].concat(sample(pool, 3))), ru: p.ru
  };
}

function orderItem(p){
  const tokens = p.fr.split(/\s+/);
  return {
    kind: "order", phrase: p, answer: tokens,
    words: shuffle(tokens.map((t, i) => ({ t: t, id: i }))),
    picked: []
  };
}

function buildPool(mode){
  const pool = [];
  if(mode === "listen"){
    PHRASES.forEach(p => pool.push(audioItem(p)));
    DRILLS.filter(d => d.type === "dictation").forEach(d => pool.push({ kind: "dictation", d: d }));
    return pool;
  }
  PHRASES.forEach(p => {
    pool.push(audioItem(p));
    const c = clozeItem(p);
    if(c) pool.push(c);
    pool.push(orderItem(p));
  });
  DRILLS.filter(d => d.type !== "open").forEach(d => {
    pool.push({ kind: d.type, d: d });
  });
  return pool;
}

function practiceSize(){ return Number(state.pracSize) || 10; }

function startPractice(mode){
  const pool = buildPool(mode);
  const size = Math.min(practiceSize(), pool.length);
  session = { mode: mode, items: sample(pool, size), i: 0, score: 0, results: [], answered: false, wrong: [], last: null };
  renderPractice();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function practiceHome(){
  if(!state.practice) state.practice = { done: 0, correct: 0 };
  const p = state.practice;
  const acc = p.done ? Math.round(p.correct / p.done * 100) : 0;
  return `
    <p class="lead">Практика из всего курса: фразы, слова и задания. Один экран — одно задание. Можно в метро, можно на 5 минут.</p>
    <div class="toolbar">
      <span class="mini" style="align-self:center">Заданий за сессию:</span>
      <div class="prac-size">
        ${[5, 10, 20].map(n => `<button class="btn ${practiceSize() === n ? "on" : ""}" data-act="prac-size" data-n="${n}">${n}</button>`).join("")}
      </div>
    </div>
    <div class="prac-mode">
      <button class="prac-btn" data-act="prac-start" data-mode="mix">
        <b>Микс</b><span>порядок слов, слух, пропущенное слово, перевод, диктант</span>
      </button>
      <button class="prac-btn" data-act="prac-start" data-mode="listen">
        <b>Только слух</b><span>слушаешь и выбираешь перевод. Без текста перед глазами</span>
      </button>
    </div>
    <p class="mini">Всего решено: ${p.done}${p.done ? " · точность " + acc + "%" : ""}</p>`;
}

function practiceFeedbackText(it){
  if(it.phrase) return it.phrase.fr;
  if(it.d){
    if(it.d.answers) return it.d.answers[0];
    if(it.d.answer) return it.d.answer;
  }
  return "";
}

function practiceRuText(it){
  if(it.phrase) return it.phrase.ru;
  if(it.d && it.d.q) return it.d.q;
  return "";
}

function practiceItemHTML(it){
  const checkBtn = session.answered ? "" : `<button class="btn primary" data-act="prac-check">Проверить</button>`;

  const mark = (i) => {
    if(!session.answered || !session.last) return "";
    const opts = it.kind === "choice" ? it.d.options : (it.options || []);
    const ans = it.kind === "choice" ? it.d.answer : it.answer;
    const ci = opts.indexOf(ans);
    if(i === ci) return " ok";
    if(session.last.picked === i) return " bad";
    return "";
  };

  if(it.kind === "order"){
    const used = it.picked.map(id => it.words.find(w => w.id === id));
    const free = it.words.filter(w => it.picked.indexOf(w.id) < 0);
    return `
      <p class="note" style="margin:0 0 6px">Собери фразу в правильном порядке.</p>
      <div class="built ${used.length ? "" : "empty"}">
        ${used.map(w => `<button class="word" data-act="prac-word" data-id="${w.id}">${esc(w.t)}</button>`).join("")}
      </div>
      <div class="words">
        ${free.map(w => `<button class="word" data-act="prac-word" data-id="${w.id}">${esc(w.t)}</button>`).join("")}
      </div>
      <div class="drow">${checkBtn}</div>`;
  }

  if(it.kind === "audio"){
    return `
      <div class="toolbar" style="margin:0 0 10px">
        <button class="btn primary" data-act="prac-play">▶ Прослушать</button>
        <button class="btn" data-act="prac-play" data-slow="1">медленно</button>
      </div>
      <div class="opts col">
        ${it.options.map((o, i) => `<button class="opt wide${mark(i)}" data-act="prac-opt" data-i="${i}">${esc(o)}</button>`).join("")}
      </div>`;
  }

  if(it.kind === "cloze"){
    return `
      <p class="qphrase">${esc(it.sentence).replace("___", "<span class='gap'>___</span>")}</p>
      <div class="opts col">
        ${it.options.map((o, i) => `<button class="opt wide${mark(i)}" data-act="prac-opt" data-i="${i}">${esc(o)}</button>`).join("")}
      </div>`;
  }

  if(it.kind === "choice"){
    return `<div class="opts col">
      ${it.d.options.map((o, i) => `<button class="opt wide${mark(i)}" data-act="prac-opt" data-i="${i}">${esc(o)}</button>`).join("")}
    </div>`;
  }

  if(it.kind === "dictation"){
    return `
      <div class="toolbar" style="margin:0 0 10px">
        <button class="btn primary" data-act="prac-play">▶ Прослушать</button>
        <button class="btn" data-act="prac-play" data-slow="1">медленно</button>
      </div>
      <input type="text" id="pr-in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="что услышала…">
      <div class="drow">${checkBtn}</div>`;
  }

  const hint = it.d && it.d.hint ? `<div class="hint show" style="margin-top:8px">${it.d.hint}</div>` : "";
  return `
    <input type="text" id="pr-in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="по-французски…">
    <div class="drow">${checkBtn}</div>
    ${hint}`;
}

function renderPractice(){
  const sec = document.getElementById("practice");
  if(!sec) return;

  if(!session){ sec.innerHTML = practiceHome(); return; }
  if(session.i >= session.items.length){ sec.innerHTML = practiceResult(); return; }

  const it = session.items[session.i];
  const total = session.items.length;
  const n = session.i + 1;
  const dots = session.results.map(ok => `<span class="pdot ${ok ? "on" : "bad"}"></span>`).join("")
    + Array.from({ length: total - session.results.length }, () => `<span class="pdot"></span>`).join("");

  const fb = session.answered && session.last
    ? `<div class="fb show ${session.last.ok ? "ok" : "bad"}">
        ${session.last.ok ? "Верно." : "Не то."}
        ${session.last.ok ? "" : `<span class="ans fr">${esc(session.last.correct || "")}</span>`}
      </div>`
    : "";

  sec.innerHTML = `
    <div class="lvtop"><button class="back" data-act="prac-quit">← выйти</button></div>
    <div class="lvhead">
      <span class="lvnum">${n}</span>
      <div>
        <h2 class="lvtitle">${session.mode === "listen" ? "Только слух" : "Микс"}</h2>
        <p class="lvgoal">${n} из ${total} · верно ${session.score}</p>
      </div>
    </div>
    <div class="lvprog">${dots}</div>
    <div class="card" style="margin-top:16px">
      ${practiceItemHTML(it)}
      ${fb}
      ${session.answered ? `<div class="toolbar" style="margin-top:14px"><button class="btn primary" data-act="prac-next">Дальше →</button></div>` : ""}
    </div>`;
}

function practiceResult(){
  const total = session.items.length;
  const score = session.score;
  const acc = Math.round(score / total * 100);
  const wrong = session.wrong;
  return `
    <div class="card">
      <p class="mini">${session.mode === "listen" ? "Только слух" : "Микс"} · ${total} заданий</p>
      <div class="result-score">${score} из ${total}</div>
      <p class="note">${acc >= 90 ? "Отлично. Это уже уверенно." : acc >= 70 ? "Нормально, но есть что подтянуть." : "Тяжело — и это нормально. Повтори, станет легче."}</p>
      <div class="toolbar" style="margin-top:14px">
        <button class="btn primary" data-act="prac-again">Ещё раз</button>
        <button class="btn" data-act="prac-quit">На главную</button>
      </div>
    </div>
    ${wrong.length ? `<h2>Разбор</h2>${wrong.map(it => `
      <div class="mistake">
        <div class="fr">${esc(practiceFeedbackText(it))}</div>
        <div class="ru">${esc(practiceRuText(it))}</div>
      </div>`).join("")}` : ""}`;
}

function practiceCheck(given, optIdx){
  const it = session.items[session.i];
  let ok = false;
  let correct = "";

  if(it.kind === "audio" || it.kind === "cloze"){
    correct = it.answer;
    ok = optIdx >= 0 && it.options[optIdx] === it.answer;
  } else if(it.kind === "choice"){
    correct = it.d.answer;
    ok = optIdx >= 0 && it.d.options[optIdx] === it.d.answer;
  } else if(it.kind === "order"){
    correct = it.answer.join(" ");
    const built = it.picked.map(id => it.words.find(w => w.id === id).t);
    ok = built.length === it.answer.length && built.every((t, i) => t === it.answer[i]);
  } else if(it.kind === "find3"){
    correct = it.d.answer || "";
    const v = base(given);
    ok = it.d.keywords.every(k => v.indexOf(base(k)) >= 0);
  } else {
    correct = it.d.answers ? it.d.answers[0] : "";
    ok = it.d.answers.some(a => base(a) === base(given));
  }

  session.answered = true;
  session.last = { ok: ok, correct: correct, picked: typeof optIdx === "number" ? optIdx : -1 };
  session.results.push(ok);
  if(ok) session.score++;
  else session.wrong.push(it);

  if(!state.practice) state.practice = { done: 0, correct: 0 };
  state.practice.done++;
  if(ok) state.practice.correct++;
  save();
  renderPractice();
}

document.addEventListener("click", function(e){
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act;
  if(act.indexOf("prac") !== 0) return;

  if(act === "prac-size"){
    state.pracSize = Number(el.dataset.n);
    save();
    renderPractice();
    return;
  }

  if(act === "prac-start"){
    const mode = el.dataset.mode === "listen" ? "listen" : "mix";
    stopAll();
    startPractice(mode);
    return;
  }

  if(act === "prac-quit"){
    stopAll();
    session = null;
    renderPractice();
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }

  if(act === "prac-again"){
    const mode = session.mode;
    stopAll();
    startPractice(mode);
    return;
  }

  if(act === "prac-play"){
    const it = session && session.items[session.i];
    if(!it) return;
    const src = it.kind === "dictation" ? it.d.audio : (it.phrase && it.phrase.a);
    if(!src) return;
    stopAll();
    const txt = it.kind === "dictation" ? it.d.answers[0] : it.phrase.fr;
    playFile(src, txt, el, null, el.dataset.slow ? 0.62 : null);
    return;
  }

  if(act === "prac-word"){
    if(session.answered) return;
    const it = session.items[session.i];
    if(!it || it.kind !== "order") return;
    const id = Number(el.dataset.id);
    const at = it.picked.indexOf(id);
    if(at >= 0) it.picked.splice(at, 1);
    else it.picked.push(id);
    renderPractice();
    return;
  }

  if(act === "prac-opt"){
    if(session.answered) return;
    practiceCheck("", Number(el.dataset.i));
    return;
  }

  if(act === "prac-check"){
    if(session.answered) return;
    const it = session.items[session.i];
    if(it.kind === "order"){
      if(!it.picked.length) return;
      practiceCheck("", -1);
      return;
    }
    const input = document.getElementById("pr-in");
    practiceCheck(input ? input.value : "", -1);
    return;
  }

  if(act === "prac-next"){
    session.i++;
    session.answered = false;
    session.last = null;
    renderPractice();
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
});

/* ============================ события ============================ */

function switchTab(name){
  const sec = name === "lesson" ? "lessonview" : name;
  document.querySelectorAll("main > section").forEach(s => s.classList.toggle("on", s.id === sec));
  const navName = name === "lesson" ? "lessons" : name;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.tab === navName));
  state.tab = name; save();
  window.scrollTo({top:0, behavior:"smooth"});
}

let currentLesson = 1;

function openLesson(n){
  currentLesson = Number(n);
  state.lesson = currentLesson;
  save();
  renderLessonView(currentLesson);
  switchTab("lesson");
}

document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act;
  const n = el.dataset.n;

  if(act === "tab"){
    if(el.dataset.tab === "lessons") renderLessonList();
    if(el.dataset.tab === "practice"){ session = null; renderPractice(); }
    switchTab(el.dataset.tab);
    return;
  }

  if(act === "openlesson" || act === "golesson"){ openLesson(n); return; }

  if(act === "backlessons"){ renderLessonList(); switchTab("lessons"); return; }

  if(act === "todo"){
    const L = Number(n), i = Number(el.dataset.i);
    if(!state.todo) state.todo = {};
    if(!state.todo[L]) state.todo[L] = {};
    state.todo[L][i] = !state.todo[L][i];
    save();
    el.classList.toggle("done", !!state.todo[L][i]);
    return;
  }

  if(act === "dayfromlesson"){
    const k = Number(n);
    state.days[k] = !state.days[k];
    save();
    renderLessonView(k);
    renderPlan();
    renderLessonList();
    updateProgress();
    return;
  }

  if(act === "day"){
    const k = Number(n);
    state.days[k] = !state.days[k];
    save();
    const card = el.closest(".day");
    if(card) card.classList.toggle("done", !!state.days[k]);
    el.classList.toggle("on", !!state.days[k]);
    updateProgress();
    return;
  }

  if(act === "speak"){ speak(el.dataset.text, el, el.dataset.a); return; }

  if(act === "speakall"){ speakAll(); return; }

  if(act === "rate"){
    const seq = [1, 0.85, 0.75];
    const at = seq.indexOf(state.rate);
    state.rate = seq[(at + 1) % seq.length];
    save();
    document.querySelectorAll('[data-act="rate"]').forEach(b => { b.textContent = "Скорость: " + rateText(); });
    if(currentAudio){ try{ currentAudio.playbackRate = state.rate; }catch(e){} }
    return;
  }

  if(act === "hidetr"){
    state.hideTr = !state.hideTr; save();
    const box = document.getElementById("phrasesbox");
    if(box) box.classList.toggle("hide-tr", state.hideTr);
    el.textContent = state.hideTr ? "Показать переводы" : "Скрыть переводы";
    return;
  }

  if(act === "playdict" || act === "playdictslow"){
    const d = drillByN(n);
    if(!d || !d.audio) return;
    stopAll();
    playFile(d.audio, d.answers[0], el, null, act === "playdictslow" ? 0.62 : null);
    return;
  }

  if(act === "check"){
    const d = drillByN(n);
    if(d.type === "find3") checkFind3(n); else checkFill(n);
    return;
  }

  if(act === "choice"){
    const d = drillByN(n);
    const fb = document.getElementById("fb-" + n);
    const hint = document.getElementById("hint-" + n);
    const ok = el.dataset.val === d.answer;
    rememberAnswer(n, el.dataset.val, ok ? "ok" : "bad");
    el.classList.add(ok ? "ok" : "bad");
    if(ok){
      feedback(fb, "ok", "Верно: <span class='ans fr'>" + d.answer + "</span>");
      markSolved(n);
    } else {
      feedback(fb, "bad", "Не то. " + (hint ? hint.textContent : ""));
      if(hint) hint.classList.add("show");
    }
    return;
  }

  if(act === "showans"){
    const d = drillByN(n);
    const fb = document.getElementById("fb-" + n);
    feedback(fb, "near", "Ответ: <span class='ans fr'>" + cap(d.answers ? d.answers[0] : d.answer) + "</span>");
    return;
  }

  if(act === "reveal-open"){
    const ex = document.getElementById("ex-" + n);
    if(ex) ex.classList.add("show");
    return;
  }

  if(act === "open-done"){
    const ta = document.getElementById("in-" + n);
    rememberAnswer(n, ta ? ta.value.trim() : "", "open");
    markSolved(n);
    const fb = document.getElementById("fb-" + n);
    feedback(fb, "ok", "Отмечено. Не забудь прислать фразы в чат.");
    return;
  }

  if(act === "export"){
    const text = buildReport();
    const now = new Date();
    const pad = x => String(x).padStart(2, "0");
    const name = "французский-" + now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate()) + ".txt";
    try{
      const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      toast("Файл " + name + " сохранён в «Загрузки». Скажи мне — я посмотрю.");
    }catch(e){
      toast("Не получилось сохранить файл. Нажми «Показать текстом» и скопируй вручную.");
    }
    return;
  }

  if(act === "showreport"){
    const wrap = document.getElementById("reportwrap");
    const ta = document.getElementById("reporttext");
    if(!wrap || !ta) return;
    ta.value = buildReport();
    wrap.style.display = wrap.style.display === "none" ? "block" : "none";
    if(wrap.style.display === "block") ta.select();
    return;
  }

  if(act === "reset"){
    if(confirm("Сбросить весь прогресс: дни и упражнения?")){
      state = {days:{}, drills:{}, answers:{}, todo:{}, tab:state.tab, hideTr:state.hideTr, rate:state.rate, lesson:state.lesson};
      save();
      renderAll();
    }
    return;
  }
});

document.addEventListener("keydown", ev => {
  if(ev.key === "Enter" && ev.target.matches("input[type=text]")){
    const card = ev.target.closest(".drill");
    if(!card) return;
    const n = card.id.replace("drill-", "");
    const d = drillByN(n);
    if(d.type === "find3") checkFind3(n); else checkFill(n);
  }
});

/* ============================ старт ============================ */

function renderAll(){
  renderPlan();
  renderLessonList();
  renderPractice();
  renderRef();
  renderErrors();
  updateProgress();
  const allowed = ["plan", "lessons", "lesson", "ref", "errors", "practice"];
  const tab = allowed.indexOf(state.tab) >= 0 ? state.tab : "plan";
  if(tab === "lesson"){
    currentLesson = Number(state.lesson) || 1;
    renderLessonView(currentLesson);
  }
  switchTab(tab);
}

  refreshVoices();

      : "Прогресс общий: он хранится на компьютере-сервере, поэтому одинаков на телефоне и на ноутбуке. Звук — из папки <b>audio</b>.";
  }
  renderAll();
  syncCloud();
})();
